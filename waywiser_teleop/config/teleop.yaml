/**:
  ros__parameters:
    joy_timeout: 1.0 #seconds

joy:
  ros__parameters:
    # device_name: Sony Interactive Entertainment Wireless Controller
    # device_name: Wireless Controller
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

teleop_twist_joy:
  ros__parameters:
    axis_linear: # Forward/Back
      x: 1
    scale_linear:
      x: 1.5
    scale_linear_turbo:
      x: 3.0
    axis_angular: # Left/Right
      yaw: 3
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 1.5
    enable_button: 4
    enable_turbo_button: 6

control_tower:
  ros__parameters:
    enable: true
    max_linear_speed: 2.0
    max_angular_speed: 2.0
    startup_linear_speed: 0.5
    startup_angular_speed: 0.2
    linear_speed_increment: 0.1
    angular_speed_increment: 0.1
    speed_control_rate: 10.0
    publish_rate: 10.0
    vehicle_control_enabled: true
    publish_control_tower_heartbeat: true
    control_tower_heartbeat_topic: control_tower_heartbeat
    control_tower_heartbeat_rate: 5.0
    emergency_stop_set_joy_button_index: 5
    emergency_stop_clear_joy_button_index: 7
    mux_output_topic: teleop_mux_vel
    route_topic: waywiser_path
    startup_route_file: ""
    autopilot_state_control_topic: /autopilot_state_control
    osm_tile_server_url: http://c.osm.rrze.fau.de/osmhd
    map_source: OpenStreetMap
    mux_input:
      sources: ["joystick", "keyboard", "waypoint_follower", "teleop_nav2"]
      joystick:
        topic: joy_vel_corrected
        timeout: 0.5
        priority: 100
      keyboard:
        topic: key_vel
        timeout: 0.5
        priority: 90
      waypoint_follower:
        topic: waypoint_follower_vel
        timeout: 0.5
        priority: 60
        prepend_vehicle_namespace: true
      teleop_nav2:
        topic: teleop_nav2_vel
        timeout: 0.5
        priority: 50

twist_angular_correction:
  ros__parameters:
    topic_names: ["joy_vel"]
