/oak:
  ros__parameters:
    camera:
      i_force_usb2_mode: true
      i_pipeline_type: RGBD
      i_nn_type: spatial                 # <- choose spatial NN mode here
      i_publish_tf_from_calibration: true
      i_tf_base_frame: camera_link

    rgb:
      i_output_isp: false
      # i_width: 1920
      # i_height: 1080
      i_resolution: 1080P
      i_fps: 30.0

    stereo:
      i_align_depth: true
      i_stereo_lr_check: true
      i_stereo_subpixel: true

    nn:
      # Use a bundled config or your own JSON
      # (bundled directories include: depthai_ros_driver/mobilenet, /yolo, /segmentation)
      i_nn_config_path: "depthai_ros_driver/yolo"
      # Optional fine-tuning, if your JSON doesn’t already set these:
      i_confidence_threshold: 0.5
      # If your config is COCO and you only want 'person' (class 0):
      i_classes: [0]
      i_labels: ["person"]
