/**:
  # general parameters shared by all waywise-related nodes.
  # - frame_prefix is used to prefix all frame names with a common prefix
  #   this is useful when running multiple vehicles in the same simulation with same configuration
  # - namespace is used to prefix all topic names with a common prefix
  ros__parameters:
    frame_prefix: "/"
    odom_frame: odom
    base_frame: base_link
    world_frame: map
    rear_axle_frame: rear_axle_link
    chassis_frame: chassis_link
    front_end_frame: front_end_link
    rear_end_frame: rear_end_link
    left_end_frame: left_end_link
    right_end_frame: right_end_link
    gnss_reference_frame: rear_axle_link

    front_steering_joint_names:
      ["left_front_wheel_steering_joint", "right_front_wheel_steering_joint"]
    front_wheel_joint_names:
      ["left_front_wheel_joint", "right_front_wheel_joint"]
    rear_wheel_joint_names: ["left_rear_wheel_joint", "right_rear_wheel_joint"]

    length: 0.53
    width: 0.255
    wheelbase: 0.33

    erpm_min: 1000.0
    erpm_max: 10000.0
    speed_to_erpm_factor: 4500.0
    min_turning_radius: 0.92 # wheelbase/tan(max_steering_angle)
    enuref: [57.713805, 12.890088, 203.59] # [lat, lon, height]

    enable_visualization_msgs: true

    urdf_file: "rover.urdf.xacro"
    urdf_scale: 1.0 # 1:1
    urdf_extra_args: "sim_mode:=true"

    odom_topic: "odometry"
    vehicle_pose_topic: "rear_axle_pose"
    mission_status_topic: "mission_status"
    autopilot_state_control_topic: "autopilot_state_control"
    vehicle_alignment_reference_point_topic: "vehicle_alignment_reference_point"
    autopilot_center_pose_topic: "autopilot_center_pose"
    emergency_stop_status_topic: "emergency_stop/current_state"
    emergency_stop_update_topic: "emergency_stop/target_state"
    nav_sat_fix_extended_topic: "sensors/gnss/nav_sat_fix_extended"
    fused_nav_sat_fix_extended_topic: "sensors/gnss/fused_nav_sat_fix_extended"
    vehicle_control_command_topic: "waywiser_control_cmd"
    battery_state_topic: "battery_state"
    autopilot_vel_topic: "waywiser_autopilot_vel"
    joint_states_topic: "waywiser_joint_states"
    rtcm_frequency_topic: "rtcm_frequency"
    imu_topic: "sensors/imu/raw"
    gnss_chip_orientation_offset: [0, 0, 0.0]

waywiser_car_node:
  ros__parameters:
    vehicle_interface_type: "ext_simulated"
    servo_offset: 0.45
    servo_range: 0.9 # servo_output = servo_offset + [-servo_range/2, servo_range/2]
    #steering_angle_to_servo_gain: -0.950
    invert_servo_output: false
    # TODO: limit erpm also based on current
    # current_max: 30.0
    publish_odom_to_baselink_tf: false
    publish_world_to_odom_tf: true
    vehicle_state_poll_rate: 30 # currently same rate for both odom topic and odom->base_link tf
    min_battery_voltage: 13.6
    enable_lidar: false
    enable_camera: false
    joint_states_publish_rate: 10

    #autopilot component
    autopilot_timer_rate: 30
    waywise_control_tower_address: "127.0.0.1"
    purepursuit_radius: 1.0
    end_goal_alignment_type: 1 # Align {0: REAR_AXLE, 1: FRONT_REAR_END, 2: CENTER} with the end goal
    end_goal_alignment_threshold: 0.1 # m

waywiser_car_localization_node:
  ros__parameters:
    use_sdvp_position_fusion: false
    gnss_variant: "external"
    gnss_reference_frame: rear_axle_link
    ext_startup_timeout: 5.0
    tf_publish_rate: 0

navsatfix_extended_wrapper_node:
  ros__parameters:
    # conversion_mode: "navsatfix"
    # nav_sat_fix_input_topic: "sensors/gnss/navsat"
    conversion_mode: "tf"
    tf_object_frame: "rover"
    frame_id_override: "base_link"
    gnss_fix_type: 3
    gnss_horizontal_accuracy: 0.01
    gnss_vertical_accuracy: 0.01
    gnss_heading_accuracy: 0.1
    gnss_last_rtcm_correction_age: 0
    gnss_num_satellites: 0

emergency_stop_monitor:
  ros__parameters:
    start_with_emergency_stop: false
    cmd_vel_in_timeout: 0.5
    emergency_stop_state_publish_rate: 10

onboard_twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic: teleop_mux_vel
        timeout: 0.5
        priority: 100
      waywise:
        topic: waywiser_autopilot_vel
        timeout: 0.5
        priority: 60
      nav2:
        topic: nav2_vel
        timeout: 0.5
        priority: 50

nav2_collision_monitor:
  # Adapted from the config file:
  # https://github.com/ros-planning/navigation2/blob/humble/nav2_collision_monitor/params/collision_monitor_params.yaml
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "onboard_mux_vel"
    cmd_vel_out_topic: "nav2_collision_monitor_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    # Whether to correct source data towards to base frame movement, considering the difference
    # between current time and latest source time. If enabled, produces more accurate sources
    # positioning in the robot base frame, at the cost of slower performance. This will cause
    # average delays for ~1/(2*odom_rate) per each cmd_vel calculation cycle. However,
    # disabling this option for better performance is not recommended for the fast moving
    # robots, where during the typical rate of data sources, robot could move unacceptably
    # far. Thus reasonable odometry rates are recommended (~100 hz).
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    # Polygons represent zone around the robot for "stop" and "slowdown" action types,
    # and robot footprint for "approach" action type.
    # Footprint could be "polygon" type with dynamically set footprint from footprint_topic
    # or "circle" type with static footprint set by radius. "footprint_topic" parameter
    # to be ignored in circular case.
    PolygonStop:
      type: "polygon"
      points: [0.3, 0.2, 0.3, -0.2, -0.3, -0.2, -0.3, 0.2]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: [0.5, 0.25, 0.5, -0.25, -0.5, -0.25, -0.5, 0.25]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    FootprintApproach:
      type: "polygon"
      footprint_topic: "/polygon_stop"
      # type: "circle"
      # radius: 0.3
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      max_points: 5
      visualize: False
    observation_sources: ["scan", "pointcloud"]
    scan:
      type: "scan"
      topic: "scan_lidar"
    pointcloud:
      type: "pointcloud"
      topic: "sensors/camera/depth/points"
      min_height: 0.1
      max_height: 0.5
