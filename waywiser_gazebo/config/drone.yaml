/**:
  # general parameters shared by all waywise-related nodes.
  # - frame_prefix is used to prefix all frame names with a common prefix
  #   this is useful when running multiple vehicles in the same simulation with same configuration
  # - namespace is used to prefix all topic names with a common prefix
  ros__parameters:
    frame_prefix: "/"
    odom_frame: odom
    base_frame: base_link
    world_frame: map
    gnss_reference_frame: base_link
    enuref: [57.713805, 12.890088, 203.59] # [lat, lon, height]

    urdf_file: "drone.urdf.xacro"
    urdf_scale: 1.0 # 1:1
    urdf_extra_args: "sim_mode:=true"

    odom_topic: "odometry"
    nav_sat_fix_extended_topic: "sensors/gnss/nav_sat_fix_extended"
    fused_nav_sat_fix_extended_topic: "sensors/gnss/fused_nav_sat_fix_extended"
    rtcm_frequency_topic: "rtcm_frequency"
    imu_topic: "sensors/imu/raw"
    gnss_chip_orientation_offset: [0, 0, 0.0]

waywiser_drone_localization_node:
  ros__parameters:
    use_sdvp_position_fusion: false
    gnss_variant: "external"
    gnss_reference_frame: base_link
    ext_startup_timeout: 5.0
    tf_publish_rate: 0

navsatfix_extended_wrapper_node:
  ros__parameters:
    # conversion_mode: "navsatfix"
    # nav_sat_fix_input_topic: "sensors/gnss/navsat"
    conversion_mode: "tf"
    tf_object_frame: "drone"
    frame_id_override: "base_link"
    gnss_fix_type: 3
    gnss_horizontal_accuracy: 0.01
    gnss_vertical_accuracy: 0.01
    gnss_heading_accuracy: 0.1
    gnss_last_rtcm_correction_age: 0
    gnss_num_satellites: 0

waywiser_drone_node:
  ros__parameters:
    vehicle_interface_type: "ext_simulated"
    odom_topic: "odometry"
    input_odom_topic: "gazebo/odometry"
    vehicle_pose_topic: "drone_pose"
    quadcopter_state_topic: "quadcopter_state"
    range_topic: "sensors/range/down"
    battery_state_topic: ""
    arm_command_topic: "arm_command"
    fused_nav_sat_fix_extended_topic: "sensors/gnss/fused_nav_sat_fix_extended"
    emergency_stop_status_topic: "emergency_stop/current_state"
    emergency_stop_update_topic: "emergency_stop/target_state"
    mission_status_topic: "mission_status"
    autopilot_state_control_topic: "autopilot_state_control"
    control_tower_heartbeat_rx_state_topic: "control_tower_heartbeat_rx_state"
    joint_states_topic: "joint_states"
    publish_odom_to_baselink_tf: true
    publish_world_to_odom_tf: true
    vehicle_state_poll_rate: 30
    in_air_range_threshold: 0.20
    autopilot_timer_rate: 10
    mission_position_type: "odom"
    require_gnss_for_mission: false
    mission_waypoint_proximity: 0.5
    mission_end_goal_alignment_threshold: 0.25
    mission_cruise_speed: 1.0
    mission_max_speed: 2.0
    mission_min_approach_speed: 0.1
    mission_approach_slowdown_radius: 1.5
    mission_face_travel_direction: true
    mission_yaw_gain: 1.5
    mission_max_yaw_rate: 1.0
    # PX4 offboard setpoint bridge parameters
    command_timeout: 0.5
    mission_state_timeout: 1.0
    return_home_on_control_tower_timeout: true
    control_tower_heartbeat_topic: control_tower_heartbeat
    control_tower_heartbeat_timeout: 2.0
    return_home_command_retry_period: 2.0
    setpoint_rate: 20.0
    request_retry_period: 1.0
    auto_arm: true
    require_local_position_before_arm: false
    auto_lift_off_speed: 1.5 # m/s climb rate during auto lift-off (matches MPC_TKO_SPEED)
    auto_lift_off_height: 2.0 # m above ground to hover after lift-off
    auto_lift_off_tolerance: 0.1 # m position tolerance to consider hover reached

emergency_stop_monitor:
  ros__parameters:
    start_with_emergency_stop: false
    cmd_vel_in_timeout: 0.5
    emergency_stop_state_publish_rate: 10

onboard_twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic: teleop_mux_vel
        timeout: 0.5
        priority: 100
