name: Build Packages

on:
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install supplemental dependencies
        run: |
          apt update && apt install -y curl wget
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt install -y \
            nodejs \
            libunwind-dev \
            libqt5serialport5-dev \
            python3-pyqt5 \
            ccache \
            python3-colcon-lcov-result \
            python3-colcon-coveragepy-result

      - name: Cache MAVSDK
        id: cache-mavsdk
        uses: actions/cache@v4
        with:
          path: libmavsdk-dev_2.2.0_ubuntu22.04_amd64.deb
          key: ${{ runner.os }}-mavsdk-2.2.0

      - name: Download MAVSDK
        if: steps.cache-mavsdk.outputs.cache-hit != 'true'
        run: wget https://github.com/mavlink/MAVSDK/releases/download/v2.2.0/libmavsdk-dev_2.2.0_ubuntu22.04_amd64.deb

      - name: Install MAVSDK
        run: dpkg --install libmavsdk-*.deb

      - name: Cache rosdep
        uses: actions/cache@v4
        with:
          path: ~/.ros/rosdep
          key: ${{ runner.os }}-rosdep-${{ hashFiles('**/package.xml') }}
          restore-keys: |
            ${{ runner.os }}-rosdep-

      - name: Generate repos file with carla-ros-bridge
        run: |
          cat << 'EOF' > /tmp/deps.repos
          repositories:
            carla_ros_bridge:
              type: git
              url: https://github.com/RISE-Dependable-Transport-Systems/carla-ros-bridge.git
              version: v0.9.15-humble-dev
          EOF

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/package.xml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Run Tests
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: waywiser waywiser_agrarsense waywiser_carla waywiser_core waywiser_description waywiser_gazebo waywiser_hwbringup waywiser_nav2 waywiser_perception waywiser_rviz2 waywiser_slam waywiser_teleop waywiser_test_runner waywiser_twist_safety
          target-ros2-distro: humble
          vcs-repo-file-url: /tmp/deps.repos
          extra-cmake-args: -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
