name: Build Packages

on:
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/das-rise/waywiser/ci-image-amd64:humble
      options: --user root
    env:
      CI: "true"
      CCACHE_DIR: /opt/ccache
      WAYWISER_SKIPPED_PACKAGES: ""
      WAYWISER_PYTHON_EXTRAS: "build,waywiser_test_runner"
      WAYWISER_VENV_PATH: /opt/waywiser-ci-venv
      WAYWISER_REUSE_VENV: "true"
      WAYWISER_UNDERLAY_SETUP: /home/waywiser/workspaces/waywiser_ws/install/setup.bash
      WAYWISER_CHECKOUT_PATH: src/WayWiseR
      WAYWISER_WORKING_DIRECTORY: src/WayWiseR
      WAYWISER_CMAKE_ARGS: >-
        --no-warn-unused-cli
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
    defaults:
      run:
        working-directory: src/WayWiseR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.WAYWISER_CHECKOUT_PATH }}
          submodules: recursive
          fetch-depth: 0

      - name: Prep for local act
        if: ${{ env.ACT == 'true' }}
        working-directory: ${{ env.WAYWISER_WORKING_DIRECTORY }}
        run: |
          # Use a local git repo to avoid "reference is not a tree" since act doesn't copy .git reliably
          git init
          git config user.email "act@local"
          git config user.name "act"
          git checkout -B ${{ github.ref_name }}
          git add .
          git commit -m "Local build for act" --allow-empty
          mkdir -p /tmp/fake_github/${{ github.repository_owner }}
          ln -sf $(pwd) /tmp/fake_github/${{ github.repository }}.git

      - name: Cache ccache
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache@v4
        with:
          path: /opt/ccache
          key: ${{ runner.os }}-ccache-humble-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-humble-

      - name: Setup Workspace
        working-directory: ${{ env.WAYWISER_WORKING_DIRECTORY }}
        run: make setup ARGS="--quiet"

      - name: Build Workspace
        working-directory: ${{ env.WAYWISER_WORKING_DIRECTORY }}
        run: make build

      - name: Run Tests
        working-directory: ${{ env.WAYWISER_WORKING_DIRECTORY }}
        run: make test
