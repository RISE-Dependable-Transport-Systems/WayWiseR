name: Build Packages

on:
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/das-rise/waywiser/ci-image:humble
      options: --user root
    env:
      CI: "true"
      CCACHE_DIR: /opt/ccache
      WAYWISER_SKIPPED_PACKAGES: ""
      WAYWISER_PYTHON_EXTRAS: "build,waywiser_test_runner"
      WAYWISER_VENV_PATH: /opt/waywiser-ci-venv
      WAYWISER_REUSE_VENV: "true"
      WAYWISER_UNDERLAY_SETUP: /home/waywiser/workspaces/waywiser_ws/install/setup.bash
      WAYWISER_CMAKE_ARGS: >-
        --no-warn-unused-cli
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
    defaults:
      run:
        working-directory: src/WayWiseR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/WayWiseR
          submodules: recursive
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /opt/ccache
          key: ${{ runner.os }}-ccache-humble-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-humble-

      - name: Setup Workspace
        run: make setup ARGS="--quiet"

      - name: Build Workspace
        run: make build

      - name: Run Tests
        run: make test
