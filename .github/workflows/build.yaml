name: Build Packages

on:
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ghcr.io/das-rise/waywiser/ci-image:humble
    env:
      CI: "true"
      CCACHE_DIR: /root/.ccache
      WAYWISER_SKIPPED_PACKAGES: ""
      WAYWISER_PYTHON_EXTRAS: "build,waywiser_test_runner"
      WAYWISER_VENV_PATH: /opt/waywiser-ci-venv
      WAYWISER_REUSE_VENV: "true"
      WAYWISER_CMAKE_ARGS: >-
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DWAYWISER_BUILD_SIMULATION=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ${{ runner.os }}-ccache-humble-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-humble-

      - name: Setup Workspace
        run: make setup ARGS="--quiet --skip-prereqs --skip-ros --skip-mavsdk"

      - name: Build Workspace
        run: make build

      - name: Run Tests
        run: make test
