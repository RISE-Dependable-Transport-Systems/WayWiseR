name: Build and Push CI Images

on:
  push:
    branches:
      - experimental/jazzy
    paths:
      - ".github/workflows/Dockerfile.ci.amd64"
      - ".github/workflows/Dockerfile.ci.arm64"
      - ".github/workflows/docker-ci.yaml"
      - "Makefile"
      - "waywiser/scripts/bootstrap"
      - ".env.example"
      - ".python-version"
      - ".gitmodules"
      - "pyproject.toml"
      - "uv.lock"
      - "**/package.xml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            image: ghcr.io/das-rise/waywiser/ci-image-amd64
            dockerfile: ./.github/workflows/Dockerfile.ci.amd64
            platform: linux/amd64
            cache_scope: ci-image-amd64
          - arch: arm64
            image: ghcr.io/das-rise/waywiser/ci-image-arm64
            dockerfile: ./.github/workflows/Dockerfile.ci.arm64
            platform: linux/arm64
            cache_scope: ci-image-arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- REQUIRED FOR GHA CACHING ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.arch }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=jazzy

      - name: Build and push ${{ matrix.arch }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache optimization
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
