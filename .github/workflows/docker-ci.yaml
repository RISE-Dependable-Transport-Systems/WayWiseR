name: Build and Push CI Image

on:
    push:
        paths:
            - ".github/workflows/Dockerfile.ci"
            - ".github/workflows/docker-ci.yaml"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # --- REQUIRED FOR GHA CACHING ---
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/rise-dependable-transport-systems/waywiser/ci-image
                  tags: |
                      type=semver,pattern={{version}}
                      type=raw,value=humble,enable=true
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/humble' }}
                      type=sha

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./.github/workflows/Dockerfile.ci
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Cache optimization
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
