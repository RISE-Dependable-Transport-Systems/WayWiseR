[project]
name = "waywiser"
version = "0.1.0"
description = "Integration of WayWise with ROS2 for connected, autonomous vehicles."
readme = "README.md"
authors = [
    { name = "Ramana Avula", email = "r2avula@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.2.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
build = [
    "catkin-pkg>=1.1.0",
    "empy==3.3.2",
    "jinja2>=3.1.6",
    "kconfiglib>=14.1.0",
    "lark>=1.3.1",
    "setuptools>=80.9.0",
]
waywiser_carla = [
    "numpy<2",
    "transforms3d>=0.4.2",
]
waywiser_hwbringup = [
    "modbus-tk>=1.1.5",
    "pyserial>=3.5",
    "spidev>=3.8",
]
waywiser_perception = [
    # Packages common to all architectures.
    # Architecture-specific extras are selected automatically by the bootstrap script.
    "opencv-python==4.11.0.86",
    "ultralytics==8.3.235",
]
waywiser_perception_jetson = [
    # aarch64 / NVIDIA Jetson — TensorRT comes from JetPack apt packages;
    # torch and torchvision must be installed manually from the NVIDIA forum:
    # https://forums.developer.nvidia.com/t/pytorch-for-jetson/
    # pycuda is installed by the bootstrap script after the apt deps are present.
    "numpy>=1.23.5,<2",
    "tensorrt==10.0.1",
]
waywiser_perception_x86 = [
    # x86_64 — all packages available from PyPI.
    # pycuda is installed conditionally by the bootstrap script when a CUDA
    # toolkit is detected.
    "numpy<2",
    "torch",
    "torchvision",
    "tensorrt==10.0.1",
]
waywiser_teleop = [
    "numpy<2",
    "pyqt5>=5.15.11",
]
waywiser_test_runner = [
    "numpy<2",
    "pymap3d>=3.2.0",
    "shapely>=2.1.2",
]
email = [
    "yagmail>=0.15.293",
]
all = [
    "waywiser[build]",
    "waywiser[email]",
    "waywiser[waywiser_carla]",
    "waywiser[waywiser_hwbringup]",
    "waywiser[waywiser_perception]",
    "waywiser[waywiser_teleop]",
    "waywiser[waywiser_test_runner]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waywiser/py_src/waywiser_py"]

[tool.ruff]
# Allow lines to be as long as 99
line-length = 99

[tool.ruff.lint]
# Select E (PEP8), W (warnings), F (pyflakes), C (complexity), Q (quotes), I (imports)
select = ["E", "F", "W", "C", "Q", "I"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
docstring-code-line-length = 99

[tool.ruff.lint.isort]
known-first-party = ["waywiser_core", "waywiser_py", "waywiser_description_py", "waywiser_test_runner", "waywiser_twist_safety", "yaml"]
known-third-party = ["rclpy", "ament_index_python", "matplotlib", "numpy", "pymap3d", "shapely", "tf_transformations"]
force-sort-within-sections = true
order-by-type = false
