[project]
name = "waywiser"
version = "0.1.0"
description = "Integration of WayWise with ROS2 for connected, autonomous vehicles."
readme = "README.md"
authors = [
    { name = "Ramana Avula", email = "r2avula@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "catkin-pkg>=1.1.0",
    "depthai==2.30.0.0",
    "empy==3.3.2",
    "jinja2>=3.1.6",
    "lark>=1.3.1",
    "modbus-tk>=1.1.5",
    "numpy<2",
    "opencv-python==4.11.0.86",
    "psutil>=7.2.1",
    "pymap3d>=3.2.0",
    "pyqt5>=5.15.11",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "setuptools>=80.9.0",
    "shapely>=2.1.2",
    "spidev>=3.8",
    "transforms3d>=0.4.2",
    "typeguard>=4.4.4",
    "ultralytics==8.3.235",
    "yagmail>=0.15.293",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waywiser/py_src/waywiser_py"]

[tool.ruff]
# Allow lines to be as long as 99
line-length = 99

[tool.ruff.lint]
# Select E (PEP8), W (warnings), F (pyflakes), C (complexity), Q (quotes), I (imports)
select = ["E", "F", "W", "C", "Q", "I"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
docstring-code-line-length = 99

[tool.ruff.lint.isort]
known-first-party = ["waywiser_core", "waywiser_py", "waywiser_description_py", "waywiser_test_runner", "waywiser_twist_safety", "yaml"]
known-third-party = ["rclpy", "ament_index_python", "matplotlib", "numpy", "pymap3d", "shapely", "tf_transformations"]
force-sort-within-sections = true
order-by-type = false
