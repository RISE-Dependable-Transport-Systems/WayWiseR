drone_scenario_runner:
  ros__parameters:
    scenario_configurations_json_path: "drone_scenario_3b_test_configurations.json"
    rosbag_output_dir: "drone_scenario_3b_data"
    use_rosbag_recording: true
    quadcopter_state_topic: "quadcopter_state"
    control_vehicle_node_fqn: "waywiser_drone_node"
    arm_command_topic: "arm_command"
    nominal_command_topic: "teleop_mux_vel"
    attack_control_topic: "scenario_3b/attack_enabled"
    attack_profile_topic: "scenario_3b/attack_profile"
    auto_takeoff_enabled: true
    default_trigger_states: ["HOVERING"]
    default_trigger_delay_sec: 2.0
    default_attack_duration_sec: 8.0
    default_nominal_linear: [0.2, 0.0, 0.0]
    default_nominal_angular: [0.0, 0.0, 0.0]
    default_nominal_command_publish_rate_hz: 10.0
    arm_request_retry_period: 1.0
    vehicle_parameter_service_timeout_sec: 10.0
    runner_timer_rate: 5.0
    test_timeout: 360.0
    test_cooldown_time: 5.0
    halt_test_runner_on_timeout: false
    topics_to_record:
      [
        "arm_command",
        "scenario_3b/attack_enabled",
        "scenario_3b/attack_profile",
        "teleop_mux_vel",
        "teleop_mux_vel_compromised",
        "onboard_mux_vel",
        "twist_safety_vel",
        "cmd_vel_out",
        "quadcopter_state",
      ]

communication_channel_emulator:
  ros__parameters:
    input_topic: "teleop_mux_vel"
    output_topic: "teleop_mux_vel_compromised"
    attack_control_topic: "scenario_3b/attack_enabled"
    attack_profile_topic: "scenario_3b/attack_profile"
    default_profile_json: '{"mode": "passthrough"}'
    start_active: false
    default_publish_rate_hz: 0.0