/octomap_server: 
  ros__parameters: 
    resolution: 0.05  # voxel size in meters (default: 0.05)
    sensor_model:
      max_range: 5.0 # sensor range in meters, limit to reduce noise (default: -1 = unlimited)
      hit: 0.7  # probability for occupied voxel (default: 0.7)
      miss: 0.4  # probability for free voxel (default: 0.4)
      min: 0.1192  # minimum occupancy probability (default: 0.1192)
      max: 0.971  # maximum occupancy probability (default: 0.971)
    frame_id: 'camera_link'  
    