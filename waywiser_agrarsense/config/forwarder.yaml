/**:
  # general parameters shared by all agrarsense nodes
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    base_frame: "base_link"
    odom_frame: "odom"
    world_frame: map
    rear_axle_frame: "rear_axle_link"
    rear_end_frame: "rear_end_link"
    front_steering_joint_names: ["hitch_link_joint"]
    front_wheel_joint_names:
      ["fl1_link_joint", "fl2_link_joint", "fr1_link_joint", "fr2_link_joint"]
    rear_wheel_joint_names:
      ["rl1_link_joint", "rl2_link_joint", "rr1_link_joint", "rr2_link_joint"]

    erpm_min: 440.0
    erpm_max: 28000.0
    length: 9.9865
    width: 3.6824
    wheelbase: 5.0990
    min_turning_radius: 5.099 # wheelbase/tan(max_steering_angle)
    speed_to_erpm_factor: 528.0
    enuref: [57.713805, 12.890088, 203.59] # [lat, lon, height]
    wheel_diameter: 1.39

    rear_axle_frame_to_base_frame_offset: [2.7202, 0.0000, -0.6792]
    rear_axle_frame_to_rear_end_frame_offset: [-2.2104, 0.0000, 0.3917]

    enable_visualization_msgs: false

    urdf_file: "forwarder.urdf"
    urdf_scale: 1.0 # 1:1

    odom_topic: "odometry"
    vehicle_pose_topic: "rear_axle_pose"
    rtcm_frequency_topic: "sensors/gnss/rtcm_frequency"
    nav_pvt_pose_topic: "sensors/gnss/nav_pvt_pose"
    battery_state_topic: "sensors/battery_state"
    mission_status_topic: "mission_status"
    autopilot_state_control_topic: "autopilot_state_control"
    vehicle_alignment_reference_point_topic: "vehicle_alignment_reference_point"
    autopilot_center_pose_topic: "autopilot_center_pose"
    emergency_stop_status_topic: "emergency_stop/current_state"
    emergency_stop_update_topic: "emergency_stop/target_state"
    nav_sat_fix_extended_topic: "sensors/gnss/nav_sat_fix_extended"
    fused_nav_sat_fix_extended_topic: "sensors/gnss/fused_nav_sat_fix_extended"

    gnss_reference_frame: "base_link"
    gnss_message_rate: 10 # Hz

    vehicle_control_command_topic: "waywiser_control_cmd"
    autopilot_vel_topic: "waywiser_autopilot_vel"
    joint_states_topic: "waywiser_joint_states"
    imu_topic: "sensors/imu/raw"
    gnss_chip_orientation_offset: [0.0, 0.0, 0.0]

waywiser_car_node:
  ros__parameters:
    vehicle_interface_type: "ext_simulated"
    speed_control_type: "closed_loop_pid_speed_control"
    pid_speed_controller_gains: [1.0, 0.01, 0.05]
    servo_offset: 0.472
    servo_range: 0.4 # servo_output = servo_offset + [-servo_range/2, servo_range/2]
    invert_servo_output: false
    invert_steering_feedback_from_odom: true
    waypoint_follower_bypass_mux: false
    publish_odom_to_baselink_tf: true
    publish_world_to_odom_tf: true
    vehicle_state_poll_rate: 10 # currently same rate for both odom topic and odom->base_link tf
    min_battery_voltage: 13.6
    joint_states_publish_rate: 10
    invert_trailer_joint_state: true
    autopilot_timer_rate: 10
    enable_mavlink_interface: true
    waywise_control_tower_address: "127.0.0.1"
    waywise_control_tower_port: 14540
    purepursuit_radius: 10.0 # m
    purepursuit_forward_gain: 1.0
    purepursuit_reverse_gain: -0.4
    adaptive_pure_pursuit: true
    end_goal_alignment_type: 0 # Align {0: REAR_AXLE, 1: FRONT_REAR_END, 2: CENTER} with the end goal
    end_goal_alignment_threshold: 0.1 # m
    adaptive_approach_speed_enabled: true
    min_approach_speed: 1.39 # m/s
    yaw_accuracy_threshold_for_mission: 1.0 # degrees
    position_accuracy_threshold_for_mission: 0.7 # m

waywiser_car_localization_node:
  ros__parameters:
    use_sdvp_position_fusion: false
    gnss_variant: "external"
    ext_startup_timeout: 20.0

navsatfix_extended_wrapper_node:
  ros__parameters:
    conversion_mode: "tf"
    tf_object_frame: "forwarder"
    frame_id_override: "base_link"
    gnss_fix_type: 3
    gnss_horizontal_accuracy: 0.01
    gnss_vertical_accuracy: 0.01
    gnss_heading_accuracy: 0.1
    gnss_last_rtcm_correction_age: 0
    gnss_num_satellites: 0

waywiser_to_agrarsense_control:
  ros__parameters:
    steering_gain: 45.0

emergency_stop_monitor:
  ros__parameters:
    start_with_emergency_stop: false
    cmd_vel_in_timeout: 2.0
    emergency_stop_state_publish_rate: 10

onboard_twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: teleop_mux_vel
        timeout: 0.5
        priority: 100
      waywise:
        topic: waywiser_autopilot_vel
        timeout: 0.5
        priority: 60
      nav2:
        topic: nav2_vel
        timeout: 0.5
        priority: 50

nav2_collision_monitor:
  ros__parameters:
    cmd_vel_in_topic: "onboard_mux_vel"
    cmd_vel_out_topic: "nav2_collision_monitor_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonSlow"]
    PolygonSlow:
      type: "circle"
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: True
      radius: 20.0
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["pointcloud_front"]
    pointcloud_front:
      type: "pointcloud"
      topic: "sensors/depth_front/color/points"
      min_height: 0.1
      max_height: 0.5

waywiser_collision_monitor_node:
  ros__parameters:
    detections_topic: "sensors/rgb_front/yolov3_tinyu_detections"
    distance_threshold: 3.0 # [m]
    emergency_stop_status_topic: "emergency_stop/current_state"
    emergency_stop_update_topic: "emergency_stop/target_state"
    class_ids_to_stop: ["0"] # "0"=Person for YOLO, "15"=Person for MobileNet
    reference_frame: forwarder/rgb_front

yolo_node:
  ros__parameters:
    model_file_path: "~/workspaces/waywiser_ws/resources/yolov3-tinyu.engine"
    device: "cuda:0" # cuda:x/cpu
    confidence_threshold: 0.5 # Detection confidence threshold
    prediction_verbose: False
    color_image_topic: "sensors/rgb_front/image_rect"
    publish_annotated_image: True
    annotated_color_image_topic: "sensors/rgb_front/yolov3_tinyu_annotated_image"
    camera_base_frame: "forwarder/rgb_front"

    depth_image_topic: "sensors/depth_front/image_rect"
    depth_camerainfo_topic: "sensors/depth_front/camera_info"
    maximum_object_depth_size: 0.5

    use_tracker: False
    color_image_topic_as_stream: True
    tracker_config_filepath: "bytetrack.yaml" # "bytetrack.yaml" or "botsort.yaml"

    publish_bbox_3d_markers: False # markers cannot be published without using a tracker
    rviz_3d_visualization_markers_topic: ""
    detections_topic: "sensors/rgb_front/yolov3_tinyu_detections"
